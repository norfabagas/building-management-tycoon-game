name: Flutter checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PUB_CACHE: ${{ github.workspace }}/.tools/pub-cache

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: design/production/package-lock.json
      - run: npm ci --prefix design/production
      - run: node design/production/validate.mjs
      - run: node --test tool/offline_worker_test.mjs tool/app_update_test.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: dart run tool/build_web.dart
      - run: flutter build apk --debug
