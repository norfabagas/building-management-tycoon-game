name: Flutter checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PUB_CACHE: ${{ github.workspace }}/.tools/pub-cache

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: dart run tool/build_web.dart
      - run: flutter build apk --debug
