name: building_management_tycoon
description: Offline 2D district and building management tycoon for Android and Web.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  sembast: ^3.8.11
  sembast_web: ^2.4.6
  sembast_sqflite: ^2.2.3
  sqflite: ^2.4.4+1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/game/manifest.json
    - assets/game/brand/
    - assets/game/backgrounds/
    - assets/game/buildings/
    - assets/game/rooms/
    - assets/game/characters/
    - assets/game/tiles/
    - assets/game/transport/
    - assets/game/icons/
    - assets/game/effects/
    - assets/game/decorations/
    - assets/game/audio/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
    - family: NotoSansThai
      fonts:
        - asset: assets/fonts/NotoSansThai.ttf
